<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<!-- Tagebuch (Version 2): Text mit Formatierung und Checklisten - dasselbe HTML wie im Web (ul[data-check] > li[data-done="1"]) -->
<style>
  :root { --fg: #1f1f1f; --muted: #6b6b6b; --brand: #7B1DD3; --line: #8a8a8a; --bg: transparent; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ececec; --muted: #9a9a9a; --line: #9a9a9a; } }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  #e { min-height: 200px; padding: 10px 12px; outline: none; word-wrap: break-word; }
  #e:empty::before { content: attr(data-placeholder); color: var(--muted); }
  h2 { font-size: 1.25em; margin: 0.6em 0 0.3em; }
  p { margin: 0.3em 0; }
  ul[data-check] { list-style: none; padding-left: 4px; }
  ul[data-check] > li { position: relative; padding-left: 28px; }
  ul[data-check] > li::before { content: ""; position: absolute; left: 0; top: 4px; width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid var(--line); }
  ul[data-check] > li[data-done="1"] { color: var(--muted); text-decoration: line-through; }
  ul[data-check] > li[data-done="1"]::before { background: var(--brand); border-color: var(--brand); }
</style>
</head>
<body>
<div id="e" contenteditable="true"></div>
<script>
  const e = document.getElementById('e');
  function setHtml(html, placeholder) { e.innerHTML = html || ''; e.setAttribute('data-placeholder', placeholder || ''); }
  function getHtml() { return e.innerHTML; }
  function getText() { return e.innerText; }
  /** Text der KI: anhängen, wenn schon etwas dasteht, sonst übernehmen (wie im Web). */
  function aiInsert(html) { if ((e.innerText || '').trim()) e.innerHTML += html; else e.innerHTML = html; }
  function exec(cmd, value) { e.focus(); document.execCommand(cmd, false, value || null); }
  /** Checkliste: die Liste am Cursor umschalten, sonst eine neue anlegen. */
  function checklist() {
    e.focus();
    const sel = window.getSelection();
    let node = sel && sel.anchorNode;
    while (node && node !== e && node.nodeName !== 'UL' && node.nodeName !== 'OL') node = node.parentNode;
    if (!node || node === e || node.nodeName === 'OL') {
      document.execCommand('insertUnorderedList');
      node = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentNode).closest('ul');
    }
    if (node && node.nodeName === 'UL') { if (node.hasAttribute('data-check')) node.removeAttribute('data-check'); else node.setAttribute('data-check', ''); }
  }
  // Antippen des Kästchens setzt bzw. löst den Haken
  e.addEventListener('click', ev => {
    const li = ev.target.closest && ev.target.closest('li');
    if (!li || !li.parentNode.hasAttribute || !li.parentNode.hasAttribute('data-check')) return;
    if (ev.clientX - li.getBoundingClientRect().left > 26) return;
    if (li.getAttribute('data-done') === '1') li.removeAttribute('data-done'); else li.setAttribute('data-done', '1');
    ev.preventDefault();
  });
</script>
</body>
</html>
