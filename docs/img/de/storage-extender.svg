<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1080" width="1600" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Datei-Kacheln -->
    <rect id="f1" width="40" height="15" rx="3" fill="#B98BEA"/>
    <rect id="f2" width="40" height="15" rx="3" fill="#8FB7E8"/>
    <rect id="f3" width="40" height="15" rx="3" fill="#F2B880"/>
    <rect id="f4" width="40" height="15" rx="3" fill="#8CD3A8"/>
    <rect id="fx" width="40" height="15" rx="3" fill="none" stroke="#B4BBC7" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- 16 Dateien, 4 x 4 -->
    <g id="all">
      <use href="#f1" x="0" y="0"/><use href="#f2" x="48" y="0"/><use href="#f3" x="96" y="0"/><use href="#f4" x="144" y="0"/>
      <use href="#f2" x="0" y="22"/><use href="#f3" x="48" y="22"/><use href="#f4" x="96" y="22"/><use href="#f1" x="144" y="22"/>
      <use href="#f3" x="0" y="44"/><use href="#f4" x="48" y="44"/><use href="#f1" x="96" y="44"/><use href="#f2" x="144" y="44"/>
      <use href="#f4" x="0" y="66"/><use href="#f1" x="48" y="66"/><use href="#f2" x="96" y="66"/><use href="#f3" x="144" y="66"/>
    </g>
    <!-- Nur die zuletzt verwendeten (6), der Rest lokal bereinigt -->
    <g id="some">
      <use href="#f1" x="0" y="0"/><use href="#f2" x="48" y="0"/><use href="#f3" x="96" y="0"/><use href="#f4" x="144" y="0"/>
      <use href="#f2" x="0" y="22"/><use href="#f3" x="48" y="22"/><use href="#fx" x="96" y="22"/><use href="#fx" x="144" y="22"/>
      <use href="#fx" x="0" y="44"/><use href="#fx" x="48" y="44"/><use href="#fx" x="96" y="44"/><use href="#fx" x="144" y="44"/>
      <use href="#fx" x="0" y="66"/><use href="#fx" x="48" y="66"/><use href="#fx" x="96" y="66"/><use href="#fx" x="144" y="66"/>
    </g>
    <!-- Server: lokaler Speicherpool -->
    <g id="server">
      <rect x="0" y="0" width="240" height="160" rx="14" fill="#EEF0F4" stroke="#8D96A6" stroke-width="2"/>
      <rect x="0" y="0" width="240" height="30" rx="14" fill="#D9DDE4"/>
      <rect x="0" y="16" width="240" height="14" fill="#D9DDE4"/>
      <line x1="0" y1="30" x2="240" y2="30" stroke="#8D96A6" stroke-width="2"/>
      <circle cx="218" cy="15" r="5" fill="#3BB273"/>
    </g>
    <!-- Wolke: Storage Extender -->
    <g id="cloud">
      <circle cx="75" cy="85" r="55" fill="#EDE3FB"/>
      <circle cx="145" cy="58" r="68" fill="#EDE3FB"/>
      <circle cx="210" cy="88" r="50" fill="#EDE3FB"/>
      <rect x="10" y="80" width="255" height="95" rx="40" fill="#EDE3FB"/>
    </g>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7B1DD3"/>
    </marker>
  </defs>

  <rect width="1600" height="1080" fill="#FFFFFF"/>

  <!-- Kopf -->
  <text x="60" y="88" font-size="48" font-weight="700" fill="#1F2430">Storage Extender</text>
  <text x="60" y="128" font-size="22" fill="#5A6273">Nur nötig, wenn der Platz auf dem Server nicht reicht.</text>

  <!-- Kernaussage -->
  <rect x="60" y="160" width="1480" height="96" rx="14" fill="#F3EAFD" stroke="#7B1DD3" stroke-width="2"/>
  <text x="90" y="200" font-size="24" font-weight="700" fill="#4A1182">Ist der Storage Extender aktiviert, bestimmt seine Größe, wie viele Dateien insgesamt gespeichert werden können.</text>
  <text x="90" y="235" font-size="21" fill="#4A1182">Der lokale Speicherpool wird nicht hinzugerechnet. Er enthält eine zusätzliche Kopie der zuletzt verwendeten Dateien.</text>

  <!-- Links: genügend Platz -->
  <rect x="60" y="285" width="730" height="455" rx="16" fill="#F7F8FA" stroke="#DDE1E7" stroke-width="1.5"/>
  <text x="90" y="330" font-size="26" font-weight="700" fill="#1F2430">Genügend Platz</text>
  <text x="90" y="364" font-size="19" fill="#3D4452">Der lokale Speicherpool ist groß genug für alle Dateien.</text>
  <text x="90" y="390" font-size="19" fill="#3D4452">Alle Dateien liegen im Storage Extender und zusätzlich lokal.</text>
  <use href="#server" x="100" y="440"/>
  <use href="#all" x="128" y="490"/>
  <use href="#cloud" x="470" y="420"/>
  <use href="#all" x="514" y="502"/>
  <line x1="352" y1="520" x2="462" y2="520" stroke="#7B1DD3" stroke-width="3" marker-end="url(#arr)"/>
  <text x="407" y="505" font-size="17" fill="#4A1182" text-anchor="middle">überträgt</text>
  <text x="220" y="635" font-size="20" font-weight="700" fill="#1F2430" text-anchor="middle">Lokaler Speicherpool</text>
  <text x="608" y="635" font-size="20" font-weight="700" fill="#1F2430" text-anchor="middle">Storage Extender</text>
  <text x="90" y="700" font-size="18" fill="#5A6273">Beispiel: 800 GB Dateien, lokaler Speicherpool 1 TB, Storage Extender 4 TB</text>

  <!-- Rechts: begrenzter Platz -->
  <rect x="810" y="285" width="730" height="455" rx="16" fill="#F7F8FA" stroke="#DDE1E7" stroke-width="1.5"/>
  <text x="840" y="330" font-size="26" font-weight="700" fill="#1F2430">Begrenzter Platz</text>
  <text x="840" y="364" font-size="19" fill="#3D4452">Der lokale Speicherpool reicht nicht für alle Dateien.</text>
  <text x="840" y="390" font-size="19" fill="#3D4452">Lokal liegen die zuletzt verwendeten, alle anderen nur im Storage Extender.</text>
  <use href="#server" x="850" y="440"/>
  <use href="#some" x="878" y="490"/>
  <use href="#cloud" x="1220" y="420"/>
  <use href="#all" x="1264" y="502"/>
  <line x1="1102" y1="500" x2="1212" y2="500" stroke="#7B1DD3" stroke-width="3" marker-end="url(#arr)"/>
  <text x="1157" y="485" font-size="17" fill="#4A1182" text-anchor="middle">überträgt</text>
  <line x1="1212" y1="560" x2="1102" y2="560" stroke="#7B1DD3" stroke-width="3" marker-end="url(#arr)"/>
  <text x="1157" y="588" font-size="17" fill="#4A1182" text-anchor="middle">lädt bei Bedarf</text>
  <text x="1157" y="608" font-size="17" fill="#4A1182" text-anchor="middle">nach</text>
  <text x="970" y="635" font-size="20" font-weight="700" fill="#1F2430" text-anchor="middle">Lokaler Speicherpool</text>
  <text x="1358" y="635" font-size="20" font-weight="700" fill="#1F2430" text-anchor="middle">Storage Extender</text>
  <use href="#fx" x="840" y="655"/>
  <text x="890" y="668" font-size="17" fill="#5A6273">lokal bereinigt: lange nicht verwendet, liegt im Storage Extender</text>
  <text x="840" y="700" font-size="18" fill="#5A6273">Beispiel: 3 TB Dateien, lokaler Speicherpool 200 GB, Storage Extender 4 TB</text>

  <!-- Unten: Beispiele ohne Addition -->
  <text x="60" y="800" font-size="26" font-weight="700" fill="#1F2430">Wie viele Dateien passen insgesamt? (Beispiele)</text>
  <g font-size="19" fill="#3D4452">
    <rect x="60" y="825" width="347" height="140" rx="14" fill="#F7F8FA" stroke="#DDE1E7" stroke-width="1.5"/>
    <text x="82" y="862">Lokaler Speicherpool 200 GB</text>
    <text x="82" y="888">Storage Extender 1 TB</text>
    <text x="82" y="925" font-size="22" font-weight="700" fill="#4A1182">bis 1 TB Dateien</text>
    <rect x="437" y="825" width="347" height="140" rx="14" fill="#F7F8FA" stroke="#DDE1E7" stroke-width="1.5"/>
    <text x="459" y="862">Lokaler Speicherpool 1 TB</text>
    <text x="459" y="888">Storage Extender 4 TB</text>
    <text x="459" y="925" font-size="22" font-weight="700" fill="#4A1182">bis 4 TB Dateien</text>
    <rect x="814" y="825" width="347" height="140" rx="14" fill="#F7F8FA" stroke="#DDE1E7" stroke-width="1.5"/>
    <text x="836" y="862">Lokaler Speicherpool 1 TB</text>
    <text x="836" y="888">Storage Extender 1 TB</text>
    <text x="836" y="925" font-size="22" font-weight="700" fill="#4A1182">bis 1 TB Dateien</text>
    <text x="836" y="950" font-size="16" fill="#5A6273">kein Platzgewinn</text>
    <rect x="1191" y="825" width="347" height="140" rx="14" fill="#FFF6EC" stroke="#E3A35B" stroke-width="1.5"/>
    <text x="1213" y="862">Lokaler Speicherpool 2 TB</text>
    <text x="1213" y="888">Storage Extender 500 GB</text>
    <text x="1213" y="925" font-size="22" font-weight="700" fill="#A85A00">nicht geeignet</text>
    <text x="1213" y="950" font-size="16" fill="#5A6273">Er muss alle Dateien fassen können.</text>
  </g>

  <text x="60" y="1010" font-size="18" fill="#5A6273">Der Storage Extender muss genügend Speicherplatz für alle Dateien bieten. Ist er voll, werden neue Dateien nur noch lokal gespeichert.</text>
  <text x="60" y="1038" font-size="18" fill="#5A6273">Fällt das lokale Speichervolumen aus, bleiben alle bereits übertragenen Dateien im Storage Extender erhalten.</text>
</svg>
