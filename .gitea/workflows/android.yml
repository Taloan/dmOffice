# Test-App fuer Version 2 (siehe KOORDINATION.md): bei jedem Push auf v2, der die App betrifft, baut die Gitea
# "dmOffice 2" (Paket at.dimes.dmoffice.next, laeuft neben der normalen App), signiert sie und legt sie als
# Paket in die Gitea:
#   <gitea>/api/packages/<besitzer>/generic/dmoffice-next/latest/dmOffice2.apk   (immer die neueste)
#   <gitea>/api/packages/<besitzer>/generic/dmoffice-next/<version>/dmOffice2.apk
# Diese Datei gibt es nur auf v2 - auf master laeuft sie nie.
#
# Secrets im Repo der Gitea (Einstellungen -> Actions -> Geheimnisse), dieselben Werte wie auf GitHub:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON_BASE64  (optional; braucht in Firebase eine Android-App at.dimes.dmoffice.next - sonst kein Push)
#   REGISTRY_TOKEN               (wie fuer das Docker-Image: Zugangstoken mit write:package)
#
# Der Job laeuft im Image cirruslabs/android-sdk (JDK und Android-SDK) statt im docker:cli des Runners.
# Kein Node darin: `git clone` und curl statt Aktionen.
name: android
on:
  push:
    branches: [v2]
    paths: ['apps/mobile/**', '.gitea/workflows/android.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/android-sdk:36
      # Gradle-Cache bleibt zwischen den Laeufen (Wrapper, Bibliotheken, Build-Cache), direkt auf dem Cache-Pool (/mnt/cache, nicht
      # ueber die Freigaben-Schicht /mnt/user - die kostet bei vielen kleinen Dateien CPU); der Ordner ist in der
      # config.yaml des Runners unter container.valid_volumes freigegeben
      options: -v /mnt/cache/appdata/gradle-cache:/gradle-cache
    steps:
      - name: bauen, signieren, als Paket in die Gitea
        shell: bash
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITEA_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GRADLE_USER_HOME: /gradle-cache
        run: |
          set -euo pipefail
          gitea="${GITHUB_SERVER_URL%/}"
          besitzer="$GITHUB_REPOSITORY_OWNER"
          auth=$(printf '%s:%s' "$GITHUB_ACTOR" "$TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="Authorization: Basic $auth" clone --depth 1 -b "$GITHUB_REF_NAME" "$gitea/$GITHUB_REPOSITORY.git" quelle
          cd quelle/apps/mobile

          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Firebase-Push: an (falls die Datei at.dimes.dmoffice.next enthaelt)"
          else
            echo "::warning::Secret GOOGLE_SERVICES_JSON_BASE64 fehlt - die Test-App hat keinen Push und fragt alle 15 Minuten"
          fi

          # Version 2.0.<Lauf>: steigt mit jedem Lauf, sonst nimmt Android kein Update an
          v="2.0.${GITHUB_RUN_NUMBER}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          pakete="$gitea/api/packages/$besitzer/generic/dmoffice-next"
          # Schlaegt der Bau fehl, liegt das Protokoll als Paket dmoffice-next-log/<lauf>/build.log in der Gitea.
          # Ohne Lint-Pruefung (lief parallel zu R8 und nahm ihm die vier Kerne) - der Release-Build auf GitHub prueft weiter.
          # Speicher und Kerne fuer Gradle stehen in gradle.properties im Cache-Ordner auf dem Runner-Host.
          # Alle vier Kerne, normale Prioritaet (Prod laeuft seit 25.10.2026 auf dem vServer); Kotlin ohne eigenen Daemon.
          # Ohne R8 (build.gradle.kts, -Pnext) - das war der langsamste Schritt
          if ! bash ./gradlew --no-daemon --build-cache --max-workers=4 -Pkotlin.compiler.execution.strategy=in-process :app:assembleRelease -x lintVitalRelease -PappVersion="$v" -Pnext 2>&1 | tee build.log; then
            curl -sS -u "$GITHUB_ACTOR:$TOKEN" --upload-file build.log "$gitea/api/packages/$besitzer/generic/dmoffice-next-log/$GITHUB_RUN_NUMBER/build.log" || true
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 fehlt - siehe Kopf von .gitea/workflows/android.yml"; exit 1; fi

          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP:-/tmp}/dmoffice.jks"
          mkdir -p out
          "$tools/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk out/aligned.apk
          "$tools/apksigner" sign --ks "${RUNNER_TEMP:-/tmp}/dmoffice.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out out/dmOffice2.apk out/aligned.apk
          "$tools/apksigner" verify out/dmOffice2.apk
          rm -f out/aligned.apk "${RUNNER_TEMP:-/tmp}/dmoffice.jks"

          # Generische Pakete lassen sich nicht ueberschreiben: "latest" erst loeschen, dann neu hochladen
          curl -fsS -u "$GITHUB_ACTOR:$TOKEN" --upload-file out/dmOffice2.apk "$pakete/$v/dmOffice2.apk"
          curl -sS -u "$GITHUB_ACTOR:$TOKEN" -X DELETE "$pakete/latest" -o /dev/null || true
          curl -fsS -u "$GITHUB_ACTOR:$TOKEN" --upload-file out/dmOffice2.apk "$pakete/latest/dmOffice2.apk"
          # Fuer das Image desselben Stands (App vom eigenen Server): unter sha-<kurz>, mit Version und versionCode wie in build.gradle.kts
          kurz=$(echo "$GITHUB_SHA" | cut -c1-7)
          code=$(echo "$v" | awk -F. '{ print $1 * 10000 + $2 * 100 + $3 }')
          printf '{"version":"%s","versionCode":%s,"sha":"%s","name":"dmOffice2.apk"}' "$v" "$code" "$kurz" > out/app.json
          curl -fsS -u "$GITHUB_ACTOR:$TOKEN" --upload-file out/dmOffice2.apk "$pakete/sha-$kurz/dmOffice2.apk" || true
          curl -fsS -u "$GITHUB_ACTOR:$TOKEN" --upload-file out/app.json "$pakete/sha-$kurz/app.json" || true
          curl -fsS -u "$GITHUB_ACTOR:$TOKEN" --upload-file out/app.json "$pakete/latest/app.json" || true
          echo "APK: $pakete/latest/dmOffice2.apk (Version $v, $(du -h out/dmOffice2.apk | cut -f1))"
