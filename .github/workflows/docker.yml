# Image fuer GitHub: baut das Dockerfile fuer linux/amd64 und legt es in die GitHub Container Registry.
#   Push auf master  -> ghcr.io/<besitzer>/dmoffice:latest und :sha-<kurz>
#   Tag v1.2.3       -> zusaetzlich :1.2.3, :1.2 und :latest
# Aenderungen nur an der Android-App (apps/) oder an docs/ bauen kein neues Image; die App hat android.yml.
# Die Versionsnummer in der Oberflaeche: beim Tag 1.2.3, sonst JJJJ.MM.TT-<kurz> wie in der Gitea.
# Der Gitea-Workflow (.gitea/workflows/docker.yml) baut unabhaengig davon in die eigene Registry.
name: docker
on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore: ['apps/**', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$(date +%Y.%m.%d)-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dmoffice
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
