# Image for GitHub: builds the Dockerfile for linux/amd64 and pushes it to the GitHub Container Registry.
#   Push to master  -> ghcr.io/<owner>/dmoffice:edge and :sha-<short>   (tested dev builds)
#   Tag v1.2.3      -> :1.2.3, :1.2 and :latest                          (releases only)
# So :latest always points at a released version, never at an untested master commit. Pull :edge to track master.
# Changes only to the Android app (apps/) or docs/ do not build a new image; the app has android.yml.
# The version number in the interface: for tag 1.2.3 it is 1.2.3, otherwise YYYY.MM.DD-<short>, as in Gitea.
# The Gitea workflow (.gitea/workflows/docker.yml) builds independently into its own registry.
# TODO (hardening): pin every `uses:` to a commit SHA (Dependabot keeps them current) and sign the image
# (cosign) with provenance/SBOM so pulls can be verified.
name: docker
on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore: ['apps/**', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$(date +%Y.%m.%d)-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dmoffice
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
