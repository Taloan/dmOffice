# Image for GitHub: builds the Dockerfile for linux/amd64 and pushes it to the GitHub Container Registry.
#   Push to master  -> ghcr.io/<owner>/dmoffice:edge and :sha-<short>   (tested dev builds)
#   Tag v1.2.3      -> :1.2.3, :1.2 and :latest                          (releases only)
# So :latest always points at a released version, never at an untested master commit. Pull :edge to track master.
# Changes only to docs/ do not build a new image.
# The version number in the interface: for tag 1.2.3 it is 1.2.3, otherwise YYYY.MM.DD-<short>, as in Gitea.
# The Gitea workflow (.gitea/workflows/docker.yml) builds independently into its own registry.
# Every `uses:` is pinned to a commit SHA (tag in the comment); Dependabot proposes updates.
# Still open: sign the image (cosign) with provenance/SBOM so pulls can be verified.
name: docker
on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$(date +%Y.%m.%d)-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/dmoffice
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
