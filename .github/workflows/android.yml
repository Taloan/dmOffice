# Android app (apps/mobile): for every version tag v1.2.3 (also android-v1.2.3) builds the release APK, signs it
# and attaches it as dmOffice-1.2.3.apk and dmOffice.apk to exactly that release - so
# releases/latest/download/dmOffice.apk (Settings -> Install apps -> Android app) always has an APK.
# By hand (workflow_dispatch) with "release" = an existing tag: attach the APK to that release afterwards;
# without it: only a build artifact.
#
# Security: build and signing run in SEPARATE jobs. The gradle build (which runs third-party plugin and
# dependency code) never sees the signing key, and never has write access to the repo or releases. The signing
# job runs in the GitHub environment "android-release" - configure it with required reviewers so a human
# approves before the signing key is used (Settings -> Environments). The signing key stays in secrets:
#   ANDROID_KEYSTORE_BASE64   keystore file as Base64 (base64 -w0 dmoffice.jks)
#   ANDROID_KEYSTORE_PASSWORD password of the keystore
#   ANDROID_KEY_ALIAS         alias of the key
#   ANDROID_KEY_PASSWORD      password of the key (often the same as the keystore password)
# Always use the same key: Android only installs an update with the same signature.
# Push needs GOOGLE_SERVICES_JSON_BASE64 = google-services.json from the Firebase console as Base64.
#
# Every `uses:` is pinned to a commit SHA (tag in the comment); Dependabot (.github/dependabot.yml) proposes updates.
# Still open: build provenance (actions/attest-build-provenance) once the signing job is settled.
name: android
on:
  push:
    tags: ['v*', 'android-v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Existing release tag (e.g. v1.1.0) to attach the APK to - empty: artifact only'
        required: false

# Least privilege for the whole workflow; the signing job raises its own contents:write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: version
        id: version
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
        run: |
          tag="$RELEASE_INPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; fi
          v="${tag#android-}"; v="${v#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${v:-dev-${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"
      # Push (Firebase Cloud Messaging): google-services.json is gitignored, so it comes from a secret.
      - name: firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Firebase push: on"
          else
            echo "::warning::Secret GOOGLE_SERVICES_JSON_BASE64 is missing - the APK has no push (see the top of android.yml)"
          fi
      - name: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          bash ./gradlew --no-daemon :app:assembleRelease -PappVersion="$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-unsigned
          path: apps/mobile/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    # Human approval before the signing key is used (configure required reviewers for this environment).
    environment: android-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-unsigned
          path: in
      - name: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing - see the top of android.yml"; exit 1; fi
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dmoffice.jks"
          mkdir -p out
          "$tools/zipalign" -f -p 4 in/app-release-unsigned.apk out/aligned.apk
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/dmoffice.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "out/dmOffice-$VERSION.apk" out/aligned.apk
          "$tools/apksigner" verify "out/dmOffice-$VERSION.apk"
          rm -f out/aligned.apk "$RUNNER_TEMP/dmoffice.jks"
          if [ -n "$TAG" ]; then cp "out/dmOffice-$VERSION.apk" out/dmOffice.apk; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmOffice-apk
          path: out/*.apk
      # Attach to the release of this tag (if it exists already, title and text are kept)
      - if: needs.build.outputs.tag != ''
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: out/*.apk
